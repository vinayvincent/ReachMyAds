: 0.0745, "base": 113.13};
const P = new URLSearchParams(location.search || window.__Q || '');
const W = +P.get('w')||1080, H = +P.get('h')||1080;
const THEME = P.get('theme')||'light';
const MODE = P.get('mode')||'intro';        // intro | loader
const BG = P.get('bg')!=='none';
const INK = THEME==='dark' ? '#FFFFFF' : '#15152B';
const PAPER = THEME==='dark' ? '#15152B' : '#FFFFFF';
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('stage');
svg.setAttribute('width',W); svg.setAttribute('height',H);
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const el=(n,a={},p=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};

if(BG) el('rect',{width:W,height:H,fill:PAPER});

// Logo in its native units: mark 40..131, text 162..645, y 40..132
const LOGO={x0:40,x1:645,y0:40,y1:132};
const MARK_C={x:85.5,y:86};
const root=el('g');
const logo=el('g',{},root);
const markG=el('g',{},logo);
const STROKE_D='M50 122 V86.5 A34 34 0 0 1 84 52.5';
const stroke=el('path',{d:STROKE_D,fill:'none',stroke:INK,'stroke-width':20,'stroke-linecap':'round','stroke-linejoin':'round'},markG);
const LEN=stroke.getTotalLength();
const DOT={x:119,y:52.5,r:12.5};
const rings=[0,1].map(()=>el('circle',{cx:DOT.x,cy:DOT.y,r:DOT.r,fill:'none',stroke:INK},markG));
const dotG=el('g',{},markG);
const dot=el('circle',{cx:DOT.x,cy:DOT.y,r:DOT.r,fill:INK},dotG);

const defs=el('defs');
const cp=el('clipPath',{id:'txtclip'},defs);
el('rect',{x:140,y:20,width:560,height:116},cp);
const textG=el('g',{'clip-path':'url(#txtclip)'},logo);
const letters=G.letters.map(L=>{
  const outer=el('g',{},textG);
  el('path',{d:L.d,fill:INK,transform:`translate(${L.tx} ${G.base}) scale(${G.S} ${-G.S})`},outer);
  return outer;
});

// ---------- easing ----------
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const easeOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const easeInOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeInCubic=x=>x*x*x;
const easeOutBack=(x,s=2.2)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const lerp=(a,b,t)=>a+(b-a)*t;

function setStroke(head,tail){ // 0..1 along path
  const h=clamp(head), tl=clamp(tail);
  const vis=Math.max(0,h-tl)*LEN;
  if(vis<0.01 && h<=0){stroke.style.opacity=0;return;}
  stroke.style.opacity=1;
  stroke.setAttribute('stroke-dasharray',`${vis} ${LEN*2}`);
  stroke.setAttribute('stroke-dashoffset',`${-tl*LEN}`);
}
function setDot(s){
  dotG.setAttribute('transform',`translate(${DOT.x} ${DOT.y}) scale(${Math.max(0,s)}) translate(${-DOT.x} ${-DOT.y})`);
}
let RING_GROW=34;
function setRing(i,p){ // p 0..1
  const r=rings[i];
  if(p<=0||p>=1){r.style.opacity=0;return;}
  const e=easeOutCubic(p);
  r.setAttribute('r',lerp(DOT.r,DOT.r+RING_GROW,e));
  r.setAttribute('stroke-width',lerp(5,0.5,e));
  r.style.opacity=0.55*(1-p);
}

// frame placement
const logoW=LOGO.x1-LOGO.x0, logoCx=(LOGO.x0+LOGO.x1)/2, logoCy=(LOGO.y0+LOGO.y1)/2;
const fill = (+P.get('fill')) || (W>H ? 0.52 : 0.72);
const SCALE = MODE==='loader' ? (Math.min(W,H)*0.5)/92 : (W*fill)/logoW;

// ---------- INTRO (5s) ----------
const INTRO_DUR=5;
function intro(t){
  // 1. stroke reaches toward the dot
  const sp=easeInOutCubic(seg(t,0.15,0.95));
  setStroke(sp,0);
  // 2. dot pops when reached, sends out signal rings
  const dp=seg(t,0.82,1.25);
  setDot(dp<=0?0:easeOutBack(dp));
  setRing(0,seg(t,0.9,1.9));
  setRing(1,seg(t,1.12,2.12));
  // 3. mark slides left while the wordmark rises in
  const mv=easeInOutCubic(seg(t,1.3,2.15));
  const markScale=lerp(2.3,1,mv);
  const cx=lerp(MARK_C.x,logoCx,mv), cy=lerp(MARK_C.y,logoCy,mv);
  logo.setAttribute('transform',`translate(${W/2} ${H/2}) scale(${SCALE*markScale}) translate(${-cx} ${-cy})`);
  letters.forEach((g,i)=>{
    const lp=easeOutExpo(seg(t,1.78+i*0.045,2.6+i*0.045));
    g.setAttribute('transform',`translate(0 ${lerp(96,0,lp)})`);
  });
  // 4. soft fade out for a clean loop
  const out=easeInCubic(seg(t,4.55,4.95));
  root.style.opacity=1-out;
}

// ---------- LOADER (1.8s loop, mark only) ----------
const LOOP_DUR=1.8;
function loader(t){
  t=((t%LOOP_DUR)+LOOP_DUR)%LOOP_DUR; RING_GROW=22;
  const head=easeInOutCubic(seg(t,0,0.62));
  const tail=easeInOutCubic(seg(t,1.12,1.72));
  setStroke(head,tail);
  const dIn=seg(t,0.5,0.85), dOut=seg(t,1.3,1.7);
  setDot(dOut>0 ? 1-easeInCubic(dOut) : (dIn<=0?0:easeOutBack(dIn)));
  setRing(0,seg(t,0.56,1.4));
  setRing(1,seg(t,0.74,1.58));
  letters.forEach(g=>g.style.display='none');
  logo.setAttribute('transform',`translate(${W/2} ${H/2}) scale(${SCALE}) translate(${-MARK_C.x} ${-MARK_C.y})`);
}

window.DURATION = MODE==='loader'?LOOP_DUR:INTRO_DUR;
window.renderAt = t => (MODE==='loader'?loader:intro)(t);
if(P.get('t')!==null){ renderAt(+P.get('t')); }
else { const s=performance.now(); const tick=n=>{renderAt(((n-s)/1000)%(window.DURATION+(MODE==='loader'?0:0.6)));requestAnimationFrame(tick)}; requestAnimationFrame(tick); }
</script>
