<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reach My Ads – page loader</title>
<style>
  /* ===== Reach My Ads page loader =====
     1. Copy the <style> rules marked "loader" and the #rma-loader element into your site.
     2. It follows the visitor's light/dark setting automatically.
        To force a theme, add data-theme="light" or data-theme="dark" to <html>.
     3. The small script at the bottom hides it once the page has loaded. */

  /* loader */
  #rma-loader{--paper:#FFFFFF;--ink:#15152B;position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--paper);transition:opacity .45s ease,visibility .45s}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #rma-loader{--paper:#15152B;--ink:#FFFFFF}}
  :root[data-theme="dark"] #rma-loader{--paper:#15152B;--ink:#FFFFFF}
  #rma-loader.is-done{opacity:0;visibility:hidden}
  #rma-loader svg{width:clamp(64px,14vmin,120px);height:auto;overflow:visible}
  #rma-loader .s{fill:none;stroke:var(--ink);stroke-width:20;stroke-linecap:round;stroke-dasharray:0 200;animation:rma-s 1.8s infinite}
  #rma-loader .d{fill:var(--ink);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:rma-d 1.8s infinite}
  #rma-loader .r{fill:none;stroke:var(--ink);opacity:0;transform-box:fill-box;transform-origin:center;animation:rma-r 1.8s infinite cubic-bezier(.33,1,.68,1)}
  #rma-loader .r2{animation-delay:.18s}
  @keyframes rma-s{
    0%{stroke-dasharray:0 200;stroke-dashoffset:0;opacity:0;animation-timing-function:cubic-bezier(.65,0,.35,1)}
    .5%{opacity:1}
    34.4%{stroke-dasharray:100 200;stroke-dashoffset:0}
    62.2%{stroke-dasharray:100 200;stroke-dashoffset:0;animation-timing-function:cubic-bezier(.65,0,.35,1)}
    95%{opacity:1}
    95.6%,100%{stroke-dasharray:0 200;stroke-dashoffset:-100;opacity:0}
  }
  @keyframes rma-d{
    0%,27.8%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.9,.64,1)}
    47.2%,72.2%{transform:scale(1);animation-timing-function:cubic-bezier(.32,0,.67,0)}
    94.4%,100%{transform:scale(0)}
  }
  @keyframes rma-r{
    0%,31%{transform:scale(1);stroke-width:5;opacity:0}
    31.1%{opacity:.55}
    77.8%,100%{transform:scale(2.76);stroke-width:.2;opacity:0}
  }
  @media (prefers-reduced-motion: reduce){
    #rma-loader .s,#rma-loader .d,#rma-loader .r{animation:none}
    #rma-loader .s{stroke-dasharray:none;opacity:1}
    #rma-loader .d{transform:none}
    #rma-loader .r{display:none}
  }
  /* end loader */

  body{margin:0;font-family:system-ui,sans-serif}
</style>
</head>
<body>

<div id="rma-loader" role="status" aria-label="Loading">
  <svg viewBox="-6.5 -6 184 184" aria-hidden="true">
    <path class="s" pathLength="100" d="M50 122 V86.5 A34 34 0 0 1 84 52.5"/>
    <circle class="r" cx="119" cy="52.5" r="12.5"/>
    <circle class="r r2" cx="119" cy="52.5" r="12.5"/>
    <circle class="d" cx="119" cy="52.5" r="12.5"/>
  </svg>
</div>

<main style="padding:2rem">Your page content.</main>

<script>
  // Hide the loader once everything has loaded (kept for at least one full loop so it never just flashes).
  (function(){
    var start=Date.now(), el=document.getElementById('rma-loader');
    window.addEventListener('load',function(){
      setTimeout(function(){ el.classList.add('is-done'); }, Math.max(0,1800-(Date.now()-start)));
    });
  })();
</script>
</body>
</html>
