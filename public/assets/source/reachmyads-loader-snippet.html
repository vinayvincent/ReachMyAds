<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reach My Ads – page loader</title>
<style>
  /* ===== Reach My Ads page loader =====
     1. Copy the <style> rules marked "loader" and the #rma-loader element into your site.
     2. It follows the visitor's light/dark setting automatically.
        To force a theme, add data-theme="light" or data-theme="dark" to <html>.
     3. The small script at the bottom hides it once the page has loaded. */

  /* loader */
  #rma-loader{--paper:#FFFFFF;--ink:#15152B;position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--paper);transition:opacity .45s ease,visibility .45s}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #rma-loader{--paper:#15152B;--ink:#FFFFFF}}
  :root[data-theme="dark"] #rma-loader{--paper:#15152B;--ink:#FFFFFF}
  #rma-loader.is-done{opacity:0;visibility:hidden}
  #rma-loader svg{width:clamp(64px,14vmin,120px);height:auto;overflow:visible}
  #rma-loader .s{fill:none;stroke:var(--ink);stroke-width:20.4;stroke-linecap:round;stroke-dasharray:0 200;animation:rma-s 1.8s linear infinite}
  @keyframes rma-s{
    0%{stroke-dasharray:0 200;stroke-dashoffset:0;opacity:0}
    .5%{opacity:1}
    8.9%{stroke-dasharray:0 200;stroke-dashoffset:0;animation-timing-function:cubic-bezier(.5,1,.89,1)}
    43.3%{stroke-dasharray:100 200;stroke-dashoffset:0}
    66.7%{stroke-dasharray:100 200;stroke-dashoffset:0;animation-timing-function:cubic-bezier(.65,0,.35,1)}
    95%{opacity:1}
    95.6%,100%{stroke-dasharray:0 200;stroke-dashoffset:-100;opacity:0}
  }
  @media (prefers-reduced-motion: reduce){
    #rma-loader .s{animation:none;stroke-dasharray:none;opacity:1}
  }
  /* end loader */

  body{margin:0;font-family:system-ui,sans-serif}
</style>
</head>
<body>

<div id="rma-loader" role="status" aria-label="Loading">
  <svg viewBox="58.5 40 92 92" aria-hidden="true">
    <path class="s" pathLength="100" d="M87.2 121.8V86.6C87.2 60.7 107.5 50.2 121.8 50.2"/>
  </svg>
</div>

<main style="padding:2rem">Your page content.</main>

<script>
  // Hide the loader once everything has loaded (kept for at least one full loop so it never just flashes).
  (function(){
    var start=Date.now(), el=document.getElementById('rma-loader');
    window.addEventListener('load',function(){
      setTimeout(function(){ el.classList.add('is-done'); }, Math.max(0,1800-(Date.now()-start)));
    });
  })();
</script>
</body>
</html>
