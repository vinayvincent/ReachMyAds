<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6.5 -6 184 184" width="184" height="184" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ink{--ink:#15152B}
    @media (prefers-color-scheme: dark){.ink{--ink:#FFFFFF}}
    .s{fill:none;stroke:var(--ink);stroke-width:20;stroke-linecap:round;stroke-dasharray:0 200;animation:s 1.8s infinite}
    .d{fill:var(--ink);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:d 1.8s infinite}
    .r{fill:none;stroke:var(--ink);opacity:0;transform-box:fill-box;transform-origin:center;animation:r 1.8s infinite cubic-bezier(.33,1,.68,1)}
    .r2{animation-delay:.18s}
    @keyframes s{
      0%{stroke-dasharray:0 200;stroke-dashoffset:0;opacity:0;animation-timing-function:cubic-bezier(.65,0,.35,1)}
      .5%{opacity:1}
      34.4%{stroke-dasharray:100 200;stroke-dashoffset:0}
      62.2%{stroke-dasharray:100 200;stroke-dashoffset:0;animation-timing-function:cubic-bezier(.65,0,.35,1)}
      95%{opacity:1}
      95.6%,100%{stroke-dasharray:0 200;stroke-dashoffset:-100;opacity:0}
    }
    @keyframes d{
      0%,27.8%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.9,.64,1)}
      47.2%,72.2%{transform:scale(1);animation-timing-function:cubic-bezier(.32,0,.67,0)}
      94.4%,100%{transform:scale(0)}
    }
    @keyframes r{
      0%,31%{transform:scale(1);stroke-width:5;opacity:0}
      31.1%{opacity:.55}
      77.8%,100%{transform:scale(2.76);stroke-width:.2;opacity:0}
    }
    @media (prefers-reduced-motion: reduce){
      .s,.d,.r{animation:none}
      .s{stroke-dasharray:none;opacity:1}
      .d{transform:none}
      .r{display:none}
    }
  </style>
  <g class="ink">
    <path class="s" pathLength="100" d="M50 122 V86.5 A34 34 0 0 1 84 52.5"/>
    <circle class="r" cx="119" cy="52.5" r="12.5"/>
    <circle class="r r2" cx="119" cy="52.5" r="12.5"/>
    <circle class="d" cx="119" cy="52.5" r="12.5"/>
  </g>
</svg>
